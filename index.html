function startCompression(){if(!requireVip('compression',19))return false;if(compressionBusy){toast('已有压缩任务正在进行');return false}if(typeof MediaRecorder==='undefined'||typeof HTMLCanvasElement==='undefined'||!HTMLCanvasElement.prototype.captureStream){toast('此浏览器不支持本地WebM编码，请使用Chrome');return false}compressionBlob=null;const v=videoById(compressionId),q=VIDEO_QUALITIES[compressionQuality];const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));if(!mime){toast('浏览器未提供WebM编码器');return false}const job=compressionJob={id:v.id,quality:compressionQuality,originalSize:v.size,progress:0,status:'running',saved:false,startedAt:Date.now()};try{compressionScene=createVideoScene(v,{width:q.width,height:q.height,onTime:(e,elapsed)=>{if(job.status!=='running')return;if(!hasVipAccess('compression')){cancelCompression();openMembershipOffer('compression',19,route);return}job.progress=Math.min(99,elapsed/v.duration*100);updateCompressionUI();if(elapsed>=v.duration&&job.recorder?.state==='recording'){job.status='finishing';job.recorder.stop()}}});const recorder=new MediaRecorder(compressionScene.stream,{mimeType:mime,videoBitsPerSecond:q.bitrate});job.recorder=recorder;const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onerror=()=>{job.status='error';compressionBusy=false;clearInterval(compressionHandle);compressionScene?.stop();render();toast('编码失败，请重试')};recorder.onstop=()=>{if(compressionJob!==job)return;clearInterval(compressionHandle);compressionScene?.stop();compressionScene=null;if(job.status==='cancelled'||job.status==='error')return;compressionBusy=false;if(!requireVip('compression',19)){job.status='cancelled';return;}compressionBlob=new Blob(chunks,{type:mime});if(!compressionBlob.size){job.status='error';render();return}job.actualSize=compressionBlob.size/1024/1024;job.progress=100;job.status='done';if(route===19)render();toast('视频编码完成，可保存')};compressionBusy=true;recorder.start(4 function queryLibrary(raw,axis='all'){const q=raw.trim();if(!q)return [];let list=allLibraryMedia();if(axis==='people')return list.filter(m=>mediaMeta(m).people.some(x=>q.includes(x)));if(axis==='place')return list.filter(m=>[mediaMeta(m).place,...mediaMeta(m).scenes].some(x=>q.includes(x)));if(axis==='scene')return list.filter(m=>mediaMeta(m).scenes.some(x=>q.includes(x)));let recognized=false;const apply=fn=>{recognized=true;list=list.filter(fn)};if(q.includes('视频'))apply(m=>mediaType(m)==='video');else if(q.includes('照片'))apply(m=>mediaType(m)==='photo');const relative=q.includes('去年')?LIBRARY_YEAR-1:q.includes('今年')?LIBRARY_YEAR:null;const year=q.match(/(20\d{2})年?/);if(relative||year)apply(m=>Number(mediaMeta(m).date.slice(0,4))===Number(relative||year[1]));const month=q.match(/(?:年|\s|^)(\d{1,2})月/);if(month)apply(m=>Number(mediaMeta(m).date.slice(5,7))===Number(month[1]));const yearMonth=q.match(/(20\d{2})-(\d{2})(?!-)/);if(yearMonth)apply(m=>mediaMeta(m).date.slice(0,7)===yearMonth[0]);const date=q.match(/20\d{2}-\d{2}-\d{2}/);if(date)apply(m=>mediaMeta(m).date===date[0]);const size=q.match(/(?:大于|超过|>)\s*(\d+(?:\.\d+)?)\s*(MB|GB)/i);if(size)apply(m=>m.size>Number(size[1])*(size[2].toUpperCase()==='GB'?1024:1));const terms=[['模糊',m=>mediaType(m)==='video'?m.videoBlurScore>=60:mediaMeta(m).labels.includes('模糊照片')],['无声',m=>mediaType(m)==='video'&&!m.hasAudio],['屏幕录制',m=>mediaType(m)==='video'&&m.isScreenRecording],['自拍',m=>mediaMeta(m).labels.includes('自拍')],['宠物',m=>mediaMeta(m).scenes.includes('宠物')],['猫',m=>mediaMeta(m).scenes.includes('猫咪')],['海边',m=>mediaMeta(m).scenes.includes('海边')],['截图',m=>mediaMeta(m).labels.includes('截图')],['Live Photo',m=>mediaMeta(m).labels.includes('Live Photo')],['小林',m=>mediaMeta(m).people.includes('小林')],...['丽江','杭州','青岛'].map(p=>[p,m=>mediaMeta(m).place===p]),...['山野','湖泊','城市','日落','旅行'].map(p=>[p,m=>mediaMeta(m).scenes.includes(p)])];for(const [token,predicate] of terms)if(q.includes(token))apply(predicate);if(axis==='tim function page26(){const s=personalStats(),v=vipInfo(),vaultState=vaultReady?(vaultConfig?'已设置':'未设置'):'';return personalPage('我的',`<div class="profile-home219"><section class="profile-hero" aria-label="个人资料"><div class="profile-avatar" aria-label="用户头像">☺</div><div><h1>${libEscape(coreState.profile.nickname)}</h1><small>用户编号 ${coreState.profile.id}</small>${personalAction('编辑昵称','edit-name','inline-link')}</div></section><section class="profile-vip" aria-label="VIP会员"><span class="eyebrow">AI相册减法 VIP</span><h2>${v.label}</h2><p class="small">${v.detail}</p><button class="primary" data-route="27">查看会员中心 →</button></section><section class="profile-group219" aria-labelledby="profile-results219"><h2 id="profile-results219">整理成果</h2><div class="profile-stats"><div><strong>${s.cleanPhotos}</strong><small>已移除照片</small></div><div><strong>${s.cleanVideos}</strong><small>已清理/压缩视频</small></div><div><strong>${videoSize(s.freed)}</strong><small>已释放空间</small></div></div><p class="profile-mini-note">待删除标记不计入释放空间；导入保险箱不代表释放空间。</p><div class="profile-status">已整理 ${s.done} / ${s.total} 项 · 待处理 ${s.pendingPhotos+s.pendingVideos} 项</div></section><section class="profile-group219" aria-labelledby="profile-management219"><h2 id="profile-management219">整理管理</h2>${profileMenu([['▥','整理记录与空间统计',28,'查看整理记录、进度和空间变化。']])}</section><section class="profile-group219" aria-labelledby="profile-security219"><h2 id="profile-security219">隐私与安全</h2>${profileMenu([['◇','私密保险箱',29,'独立加密保存，密码验证后查看。','vault',vaultState]])}${profileMenu([['⚙','隐私与设置',31,'相册权限、自动锁定与数据管理。']])}</section></div>`)}

function page28(){const historyLabel=label=>({'确认演示删除':'确认删除','确认清理视频（演示）':'确认清理视频','提取封面（演示）':'提取封面','转换视频（演示）':'转换视频'}[label]||label);const s=personalStats(),last=coreState.activity[0],percent=s.total?Math.round(s.done/s.total*100):0;const suggestions=[];if(coreState.settings.aiSimilar)suggestions.push(['相似照片对比','先对比细节，再决定保留哪一张。',11]);if(coreState.settings.aiBlur)suggestions.push(['回看模糊照片','检查是否有值得留下的瞬间。',21]);if(coreState.settings.aiBest)suggestions.push(['查看最佳照片建议','按清晰度、曝光与构图对比。',12]);return personalPage('每一次整理，都有回响。',`<div class="history-metrics"><div><strong>${s.everPhotos}</strong><small>累计整理照片 · 去重</small></div><div><strong>${s.everVideos}</strong><small>累计整理视频 · 去重</small></div><div><strong>${videoSize(s.freed)}</strong><small>累计释放空间</small></div><div><strong>${percent}%</strong><small>当前整理进度</small></div></div><div class="card"><div class="row"><strong>${s.done} / ${s.total} 项已整理</strong><span>${percent}%</span></div><div class="bar" style="margin:16px 0"><span style="width:${percent}%"></span></div><small>最近整理：${last?new Date(last.time).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}):'暂无整理记录'}</small><p class="small" style="margin-top:16px">照片释放 ${videoSize(s.photoFreed)} · 视频节省 ${videoSize(s.videoFreed)}；撤销后同步回退。</p></div><h2 class="profile-section">✦ AI整理建议</h2>${suggestions.map(([t,d,n])=>`<button class="ai-banner" data-personal="suggestion" data-target="${n}"><div><strong>${t}</strong><small>${d}</small></div><span class="arrow">→</span></button>`).join('')||'<div class="card"><p class="small">你已关闭建议展示，可在设置中重新开启。</p><button class="chip" data-route="31">管理AI建议</button></div>'}<h2 class="profile-section">历史整理记录</h2><div class="card">${coreState.activity.length?coreState.activity.map(r=>`<article class="history-item"><strong>${libEscape(historyLabel(r.label))} · ${r.count} 项</strong><small>${new Date(r.time).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})}${r.delta?' · 空间变化 '+(r.delta>0?'+':'−')+videoSize(Math.abs(r.delta)):''}</small></article>`) /* Vault config and ciphertext live in an independent IndexedDB database. */
let vaultReady=false,vaultConfig=null,vaultError='',vaultKey=null,vaultData=null,vaultUntil=0,vaultEpoch=0,vaultBusy=false,vaultView='all',vaultSelection=new Set(),vaultImportSelection=new Set(),vaultURLs=[];
let vaultAttempts={count:0,until:0};try{vaultAttempts=JSON.parse(localStorage.getItem('album-vault-attempts')||'null')||vaultAttempts}catch(e){}
const VAULT_ITERATIONS=210000;
const bytes64=bytes=>{let text='';for(let i=0;i<bytes.length;i+=8192)text+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(text)};
const from64=text=>Uint8Array.from(atob(text),c=>c.charCodeAt(0));
function vaultSupported(){return typeof crypto!=='undefined'&&!!crypto.subtle&&typeof indexedDB!=='undefined'}

async function vaultEncrypt(key,value){const iv=crypto.getRandomValues(new Uint8Array(12)),plain=new TextEncoder().encode(JSON.stringify(value)),data=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain);return {iv:bytes64(iv),data:bytes64(new Uint8Array(data))}}
async function vaultDecrypt(key,record){const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(record.iv)},key,from64(record.data));return JSON.parse(new TextDecoder().decode(plain))}
async function openVaultDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('album-encrypted-vault',1);r.onupgradeneeded=()=>r.result.createObjectStore('vault');r.onerror=()=>reject(r.error);r.onsuccess=()=>resolve(r.result)})}
async function readVaultDB(){const db=await openVaultDB();return new Promise((resolve,reject)=>{const tx=db.transaction('vault','readonly'),store=tx.objectStore('vault'),a=store.get('config'),b=store.get('content');tx.oncomplete=()=>{db.close();resolve({config:a.result||null,content:b.result||null})};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function writeVaultDB(records){const db=await openVaultDB();return new Promise((resolve,reject)=>{const tx=db.transaction('vault','readwrite');for(const [id,data] of Object.entries(records))tx.objectStore('vault').put(data,id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function initVault(){if(!vaultSupported()){vaultError='当前环境不支持加密或本地数据库，请在Chrome打开原型。';return false}try{const stored=await readVaultDB();vaultConfig=stored.config;vaultReady=true;return true}catch(e){vaultError='保险箱存储不可用。未创建或覆盖任何保险箱。';vaultReady=false;return false}}
function vaultUnlocked(){if(vaultKey&&vaultData&&Date.now()<vaultUntil)return true;if(vaultKey)lockVault();return false}
function lockVault(){vaultKey=null;vaultData=null;vaultUntil=0;vaultEpoch++;vaultSelection.clear();vaultImportSelection.clear();for(const url of vaultURLs)URL.revokeObjectURL(url);vaultURLs=[];$('overlay').innerHTML=''}

async function setupVault(pin,confirm){if(!vaultReady||vaultBusy||vaultConfig)throw Error('请等待保险箱就绪，已有保险箱不能覆盖');if(!/^\d{6}$/.test(pin))throw Error('请输入6位数字密码');if(pin!==confirm)throw Error('两次输入的密码不一致');vaultBusy=true;try{const salt=bytes64(crypto.getRandomValues(new Uint8Array(16))),key=await deriveVaultKey(pin,salt),config={version:1,salt,iterations:VAULT_ITERATIONS,check:await vaultEncrypt(key,'AI相册减法/vault')},data={items:[],trash:[]};const existing=await readVaultDB();if(existing.config)throw Error('检测到已有保险箱，请刷新后验证');await writeVaultDB({config,content:await vaultEncrypt(key,data)});vaultConfig=config;vaultKey=key;vaultData=data;vaultUntil=Date.now()+300000;vaultAttempts={count:0,until:0};saveVaultAttempts();return true}finally{vaultBusy=false}}

async function commitVault(change){if(!vaultUnlocked()||vaultBusy)throw Error('请先解锁保险箱');vaultBusy=true;const epoch=vaultEpoch,key=vaultKey,copy=JSON.parse(JSON.stringify(vaultData));try{await change(copy);if(epoch!==vaultEpoch)throw Error('保险箱已锁定，请重新验证');const cipher=await vaultEncrypt(key,copy);await writeVaultDB({content:cipher});if(epoch===vaultEpoch){vaultData=copy;vaultUntil=Date.now()+300000;vaultSelection.clear()}return true}finally{vaultBusy=false}}
